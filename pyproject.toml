[project]
name = "lens-view"
version = "0.1.0"
description = "Terminal viewer for lens traces (J-lens, logit lens, tuned lens), with an MCP server that opens it beside a coding agent in tmux"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["textual>=8.2", "mcp>=1.30,<2"]

[project.scripts]
lens-view = "lens_view.app:main"
lens-view-mcp = "lens_view.mcp_server:main"
lens-view-json = "lens_view.trace:main"

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "strict"
